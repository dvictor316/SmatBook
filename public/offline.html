<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#062354">
    <title>SmartProbook | Offline</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6fb;color:#071a3d;font-family:Arial,sans-serif;letter-spacing:0}.panel{width:min(520px,100%);background:#fff;border:1px solid #d7e0ed;border-top:5px solid #1463d6;border-radius:7px;padding:32px;box-shadow:0 14px 40px rgba(6,35,84,.12)}img{width:72px;height:72px;object-fit:contain}h1{font-size:1.75rem;margin:20px 0 10px}p{line-height:1.6;color:#50647e;margin:0 0 24px}.actions{display:flex;gap:12px;flex-wrap:wrap}button,a{border:0;border-radius:5px;padding:12px 18px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}button{background:#1463d6;color:#fff}a{border:1px solid #b9c8dd;color:#071a3d;background:#fff}@media(max-width:480px){.panel{padding:24px}.actions>*{width:100%;text-align:center}}
    </style>
</head>
<body>
<main class="panel">
    <img src="/assets/img/logos.png" alt="SmartProbook">
    <h1>You are offline</h1>
    <p>Reconnect to open live business records. Any sale or customer entry already saved by an offline-enabled screen will remain queued on this device and sync after the connection returns.</p>
    <div class="actions"><button type="button" onclick="location.reload()">Try Again</button><a href="/">Home</a></div>
</main>
</body>
</html>
