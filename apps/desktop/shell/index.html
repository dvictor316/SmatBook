<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartProbook</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #061a44;
        --blue: #0f3a8a;
        --red: #d7193f;
        --gold: #d7a928;
        --text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(215, 169, 40, 0.32), transparent 30%),
          linear-gradient(135deg, var(--navy), var(--blue));
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(520px, calc(100vw - 40px));
        padding: 42px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 40px;
      }

      p {
        margin: 0 0 24px;
        color: #dbeafe;
        line-height: 1.6;
      }

      .status {
        min-height: 24px;
        margin: 0 0 20px;
        color: #f2d986;
        font: 700 13px/1.5 Arial, sans-serif;
      }

      .status[data-state="offline"] {
        color: #ffd4da;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 6px;
        background: var(--gold);
        color: #071635;
        font-weight: 800;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        background: #ebc34f;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SmartProbook</h1>
      <p id="launch-message">Connecting to your secure workspace. To use offline POS, sign in online on this desktop and open the POS once so its stock and account can be saved.</p>
      <div class="status" id="connection-status" role="status" aria-live="polite">Checking connection…</div>
      <a id="open-link" href="https://smartprobook.com/pos">Open POS</a>
    </main>

    <script>
      const SMARTPROBOOK_URL = 'https://smartprobook.com';
      const POS_URL = new URL('/pos', SMARTPROBOOK_URL).href;
      const OFFLINE_POS_URL = new URL(POS_URL);
      OFFLINE_POS_URL.searchParams.set('desktop_offline', '1');
      const openLink = document.getElementById('open-link');
      const status = document.getElementById('connection-status');
      const message = document.getElementById('launch-message');
      let launchInProgress = false;

      openLink.href = POS_URL;

      function showOffline() {
        status.dataset.state = 'offline';
        status.textContent = 'You are offline. The saved POS will ask for the account password before it opens.';
        message.textContent = 'First connect, sign in on this desktop, open the POS, and let its product stock load. Offline access is limited to POS sales and saved stock; queued sales sync when you reconnect.';
        openLink.textContent = 'Try Offline POS';
        openLink.href = OFFLINE_POS_URL.href;
      }

      async function launch() {
        if (launchInProgress) return;
        if (!navigator.onLine) {
          showOffline();
          return;
        }

        launchInProgress = true;
        status.dataset.state = 'checking';
        status.textContent = 'Checking the SmartProbook connection…';

        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 7000);
        try {
          await fetch(POS_URL, {
            method: 'HEAD',
            mode: 'no-cors',
            cache: 'no-store',
            signal: controller.signal,
          });
          window.location.replace(POS_URL);
        } catch {
          showOffline();
          launchInProgress = false;
        } finally {
          window.clearTimeout(timeout);
        }
      }

      window.addEventListener('online', launch);
      window.addEventListener('offline', showOffline);
      launch();
    </script>
  </body>
</html>
