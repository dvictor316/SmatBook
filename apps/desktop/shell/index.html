<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartProbook</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #061a44;
        --blue: #0f3a8a;
        --gold: #d7a928;
        --text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(215, 169, 40, 0.32), transparent 30%),
          linear-gradient(135deg, var(--navy), var(--blue));
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(520px, calc(100vw - 40px));
        padding: 42px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 40px;
      }

      p {
        margin: 0 0 24px;
        color: #dbeafe;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--gold);
        color: #071635;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SmartProbook</h1>
      <p>Opening your secure accounting workspace. Subscription, tenant, and device rules are handled by the live SmartProbook platform.</p>
      <a id="open-link" href="https://smartprobook.com">Open SmartProbook</a>
    </main>

    <script>
      const SMARTPROBOOK_URL = 'https://smartprobook.com';
      const openLink = document.getElementById('open-link');

      openLink.href = SMARTPROBOOK_URL;
      window.location.replace(SMARTPROBOOK_URL);
    </script>
  </body>
</html>
