name: Build SmartProbook Desktop for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer release version
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload desktop source
        uses: actions/upload-artifact@v4
        with:
          name: desktop-source
          path: apps/desktop/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    needs: prepare-source
    runs-on: windows-latest
    steps:
      - name: Download desktop source
        uses: actions/download-artifact@v4
        with:
          name: desktop-source
          path: apps/desktop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Set desktop release version
        working-directory: apps/desktop
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          @'
          const fs = require("node:fs");
          const version = process.env.DESKTOP_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version ?? "")) {
            throw new Error(`Invalid desktop release version: ${version}`);
          }

          for (const file of ["package.json", "package-lock.json"]) {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.version = version;
            if (data.packages?.[""]) data.packages[""].version = version;
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          }

          const configPath = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          config.package.version = version;
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          const updatedCargo = cargo.replace(
            /^(\[package\][\s\S]*?\nversion\s*=\s*)"[^"]+"/m,
            `$1"${version}"`,
          );
          if (updatedCargo === cargo) {
            throw new Error("Could not update the desktop Cargo package version.");
          }
          fs.writeFileSync(cargoPath, updatedCargo);
          '@ | node

      - name: Build Windows MSI
        working-directory: apps/desktop
        run: npm run build -- --bundles msi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartprobook-windows-${{ inputs.version }}
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ inputs.version }}
          name: SmartProbook Desktop v${{ inputs.version }} for Windows
          body: |
            Windows desktop installer for SmartProbook.

            Sign in and synchronize the POS product catalogue while online before using offline sales.
          files: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          overwrite_files: true
          fail_on_unmatched_files: true
